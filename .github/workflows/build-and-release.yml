name: Build Web App & Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Web App (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📱 Add & Sync Android Platform (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔨 Build Android APK (Gradle Debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🚚 Copy APK to Root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Madrasa-NTRCA-Prep.apk

      - name: 📲 Upload Android APK Artifact (Direct Download APK)
        uses: actions/upload-artifact@v4
        with:
          name: Madrasa-NTRCA-Prep-APK
          path: Madrasa-NTRCA-Prep.apk
          retention-days: 30

      - name: 🤐 Zip Dist Folder for Web Hosting
        run: |
          cd dist
          zip -r ../madrasa-ntrca-web-build.zip .
          cd ..

      - name: ⬆️ Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasa-ntrca-web-build
          path: madrasa-ntrca-web-build.zip
          retention-days: 30
