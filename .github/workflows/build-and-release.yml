name: Build Web App & Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java JDK 21 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Web App (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📱 Generate & Sync Android Project (Capacitor)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔨 Build Android APK (Gradle Debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🚚 Copy APK to Root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Madrasa-NTRCA-Prep.apk

      - name: 📲 Upload Android APK Artifact (Direct Download APK)
        uses: actions/upload-artifact@v4
        with:
          name: Madrasa-NTRCA-Prep-APK
          path: Madrasa-NTRCA-Prep.apk
          retention-days: 30

      - name: 🤐 Zip Dist Folder for Web Hosting
        run: |
          cd dist
          zip -r ../madrasa-ntrca-web-build.zip .
          cd ..

      - name: ⬆️ Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasa-ntrca-web-build
          path: madrasa-ntrca-web-build.zip
          retention-days: 30

